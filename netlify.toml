[build]
  publish = "."
  command = ""

[build.processing]
  skip_processing = false

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# These assets are edited by hand (no build step, no content hashing), so they
# must revalidate on every request. A long immutable cache would serve stale
# project data after a push.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[redirects]]
  from = "/repo"
  to = "https://github.com/donne4real"
  status = 301
  force = true

[[redirects]]
  from = "/aso-oke"
  to = "https://github.com/donne4real/aso-oke"
  status = 301
  force = true
