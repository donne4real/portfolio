<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Leye Ajibola</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0A0B0D;--ink:#E9ECEF;--dim:#7C848F;--accent:#7C9CFF;--line:#23262D}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;
       min-height:100vh;display:grid;place-items:center;padding:32px;text-align:center}
  .box{max-width:520px}
  .code{font-size:4.4rem;font-weight:700;letter-spacing:-.04em;margin:0;color:var(--accent)}
  h1{font-size:1.35rem;margin:6px 0 12px;letter-spacing:-.02em}
  p{color:var(--dim);line-height:1.65;margin:0 0 26px}
  a{display:inline-block;padding:11px 22px;border:1px solid var(--line);border-radius:10px;
    color:var(--ink);text-decoration:none;font-weight:600;font-size:14.5px}
  a:hover{border-color:#3A3F49;text-decoration:none}
</style>
</head>
<body>
  <div class="box">
    <p class="code">404</p>
    <h1>That page isn't here</h1>
    <p>The link may be out of date, or the page may have moved. The work is all still reachable from the portfolio home.</p>
    <a href="/">Back to the portfolio</a>
  </div>
</body>
</html>
