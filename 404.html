<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Leye Ajibola</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#080A0F;--surface:#121620;--ink:#F1F5F9;--dim:#7B869B;--accent:#7C9CFF;--line:#232938}
  @media (prefers-color-scheme: light){:root{--bg:#FAFAF8;--surface:#FFFFFF;--ink:#0F172A;--dim:#64748B;--accent:#3B5BDB;--line:#DDE2EC}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;
       min-height:100vh;display:grid;place-items:center;padding:32px;text-align:center}
  .box{max-width:480px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:40px 32px}
  .code{font-family:"JetBrains Mono",monospace;font-size:3.8rem;font-weight:700;letter-spacing:-.04em;margin:0;color:var(--accent)}
  h1{font-size:1.35rem;margin:8px 0 12px;letter-spacing:-.02em}
  p{color:var(--dim);line-height:1.65;margin:0 0 26px;font-size:15px}
  a{display:inline-block;padding:10px 20px;background:var(--accent);border-radius:10px;
    color:#fff;text-decoration:none;font-weight:600;font-size:14px}
  a:hover{filter:brightness(1.08)}
</style>
</head>
<body>
  <div class="box">
    <p class="code">404</p>
    <h1>That page isn't here</h1>
    <p>The link may be out of date, or the page may have moved. Everything is reachable from the portfolio home.</p>
    <a href="/">Back to leyeajibola.com</a>
  </div>
</body>
</html>
